# MindGrid 跨平台构建与发布工作流
#
# 触发条件：
#   1. 推送 v* 标签
#   2. 手动触发（workflow_dispatch，输入版本号如 v0.2.0）
#
# 产物（上传到 GitHub Release）：
#   macOS   — .dmg（aarch64 + x86_64，未签名/未公证）
#   Windows — .exe (NSIS 安装包) + portable .zip（免安装版）
#   Linux   — .deb + .AppImage + .rpm
#
# 可选 Secrets（获取证书后启用代码签名）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   TAURI_SIGNING_CERTIFICATE / TAURI_SIGNING_CERTIFICATE_PASSWORD

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布标签（例如 v0.2.0）'
        required: true
        default: 'v0.2.0'

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # ─── 单元测试门禁 ───
  test:
    name: Test (三绿门禁)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build CLI (feature-gated)
        run: cargo build --manifest-path src-tauri/Cargo.toml --features cli --bin mindgrid-file

  # ─── 跨平台构建 ───
  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（可选，配置 Secrets 后自动启用）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名（可选）
          TAURI_SIGNING_CERTIFICATE: ${{ secrets.TAURI_SIGNING_CERTIFICATE }}
          TAURI_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TAURI_SIGNING_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'MindGrid ${{ env.TAG }}'
          releaseBody: 'MindGrid ${{ env.TAG }} — 请查看 Assets 下载对应平台安装包。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # ─── Windows portable（免安装版）───
      - name: Package Windows portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/MindGrid | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/mindgrid.exe" "portable/MindGrid/MindGrid.exe"
          Compress-Archive -Path "portable/MindGrid" -DestinationPath "MindGrid-${{ env.TAG }}-x64-portable.zip" -Force
          Get-Item "MindGrid-${{ env.TAG }}-x64-portable.zip" | Select-Object Name, Length

      - name: Upload portable zip to release
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: MindGrid-${{ env.TAG }}-x64-portable.zip
          fail_on_unmatched_files: true
