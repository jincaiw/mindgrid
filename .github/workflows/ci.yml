# MindGrid CI — 持续集成（测试门禁）
#
# 每次 push / PR 自动运行三绿验证：
#   pnpm test + pnpm build + cargo test + CLI 构建

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  test:
    name: Three-Green Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ─── 三绿验证 ───
      - name: 1️⃣ Frontend tests
        run: pnpm test

      - name: 2️⃣ Frontend build
        run: pnpm build

      - name: 3️⃣ Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: CLI build (feature-gated)
        run: cargo build --manifest-path src-tauri/Cargo.toml --features cli --bin mindgrid-file

      - name: Rust release check
        run: cargo check --manifest-path src-tauri/Cargo.toml --release
