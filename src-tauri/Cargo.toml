[package]
name = "mindgrid"
version = "0.3.5"
description = "MindGrid desktop application shell"
authors = ["MindGrid"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "mindgrid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mindgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mindgrid-file"
path = "src/bin/mindgrid_file.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# 启用 mindgrid-file CLI 二进制（inspect/validate/extract/repair/migrate/pack）。
# 默认不构建，通过 `cargo build --features cli` 或 `cargo run --features cli --bin mindgrid-file` 启用。
cli = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false }
sha2 = "0.10"
hex = "0.4"
